spring.application.name=f1-stats-api
server.port=8080

jolpica.api.base-url=https://api.jolpi.ca/ergast/f1

# Base de dados H2 (fica guardada num ficheiro local, persiste entre execuções)
spring.datasource.url=jdbc:h2:file:./data/f1stats
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web do H2 (opcional, útil para veres os dados guardados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console